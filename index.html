<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebEyeTrack for Qualtrics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      text-align: center;
      padding: 60px 40px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 16px;
    }

    .description {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 40px;
    }

    .demo-link {
      display: inline-block;
      background: #1a1a1a;
      color: white;
      padding: 14px 32px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .demo-link:hover {
      background: #333;
    }

    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #999;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Webcam Eye Tracking for Qualtrics</h1>
    <p class="description">Browser-based eye tracking for survey research</p>
    <a href="experiments/calibration.html" class="demo-link">Launch Calibration</a>
  </div>

  <footer>
    <p>All rights reserved</p>
  </footer>
</body>
</html>
